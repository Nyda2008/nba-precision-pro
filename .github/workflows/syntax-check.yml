
name: JavaScript Syntax Check

on:
  push:
    branches:
      - phase-2-backtest-storage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          find . -type f -name "*.js" \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            -exec node --check {} \;
