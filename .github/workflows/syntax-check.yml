
name: JavaScript Syntax Check

on:
  push:
    branches:
      - phase-2-backtest-storage
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          find . -type f -name "*.js" \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            -exec node --check {} \;

      - name: Run backtesting engine tests
        run: node --test backtest-engine.test.js

  database-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: backtest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d backtest_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI_TEST_DATABASE: 'true'
      DATABASE_URL: postgresql://testuser:testpass@localhost:5432/backtest_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run PostgreSQL integration test
        run: node --test backtest-store.test.js
